    <li><a href="about.html" onclick="closeMenu()" data-i18n="nav-about">About</a></li>
    <li><a href="projects.html" onclick="closeMenu()" class="active" data-i18n="nav-projects">Projects</a></li>
    <li><a href="booking.html" onclick="closeMenu()" data-i18n="nav-booking">Book Me</a></li>
  </ul>
  <p class="menu-footer">© <span id="menu-year"></span> Prince</p>
</nav>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-label" data-i18n="recents">Recents</span>
      <span class="recents-count" id="recents-count"></span>
    </div>
    <div class="slides-wrap" id="slides-wrap">
      <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;"><div class="spinner"></div></div>
    </div>
    <button class="slide-nav prev" onclick="prevSlide()"><i class="fas fa-arrow-left"></i></button>
    <button class="slide-nav next" onclick="nextSlide()"><i class="fas fa-arrow-right"></i></button>
    <div class="slide-dots" id="slide-dots"></div>
    <div class="progress-bar" id="progress-bar"></div>
  </aside>
  <div class="main">
    <div class="page-hero">
      <p class="page-eyebrow" data-i18n="eyebrow">Selected Work</p>
      <h1 class="page-title" data-i18n="page-title">Projects &amp; Works</h1>
    </div>
    <div class="topbar">
      <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> <span data-i18n="back">Home</span></a>
      <input type="text" id="search-input" class="search-input" placeholder="Search projects..." oninput="applyFilters()" data-i18n-placeholder="search-placeholder" aria-label="Search projects by tag">
      <div class="filters no-scrollbar" id="filters"></div>
    </div>
    <div class="projects-wrap" id="projects-wrap">
      <div class="state-box">
        <div class="spinner" style="margin:0 auto 1rem;border-color:var(--border);border-top-color:var(--accent);"></div>
        <p>Loading projects...</p>
      </div>
    </div>
    <div class="end-marker"><span data-i18n="end-marker">- End of selected works -</span></div>
  </div>
</div>
<div class="modal-overlay" id="modal">
  <div class="modal-topbar">
    <button class="modal-back" onclick="closeModal()"><i class="fas fa-arrow-left"></i> Back</button>
    <span class="modal-title-bar" id="modal-title"></span>
    <button class="icon-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
  </div>
  <div class="modal-body" id="modal-body"></div>
</div>
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()"><i class="fas fa-times"></i></button>
  <div id="lightbox-inner"></div>
</div>
<script>
  // ⚠️ CHANGE THESE TWO VARIABLES TO MATCH YOUR GITHUB SETUP ⚠️
  const USER = 'MawuliPRINCE';
  const REPO = 'my-portfolio';
  const JSON_URL = `https://raw.githubusercontent.com/${USER}/${REPO}/main/projects.json`;
  
  document.getElementById('menu-year').textContent = new Date().getFullYear();
  const SLIDE_MS = 5000;
  let allProjects=[], projectsOnly=[], filtered=[], recents=[];
  let activeFilter='All', currentSlide=0, rafId=null, progressStart=null;
  let searchTerm = '';
  
  window.onload = async () => {
    initTheme();
    try {
      const res = await fetch(JSON_URL + '?t=' + Date.now());
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      allProjects = await res.json();
      console.log('✅ Loaded projects.json:', allProjects);
      if (!Array.isArray(allProjects)) throw new Error('projects.json is not an array');
      
      // --- SORTING for recents (CMS order) ---
      // Get all projects that contain at least one media item shown in recents.
      const recentsProjects = allProjects.filter(p => p.media && p.media.some(m => m.showInRecents));
      // Sort them: use recentOrder if the project is marked as recent, else fallback to projectOrder
      recentsProjects.sort((a, b) => {
        const orderA = Number.isFinite(a.isRecent ? a.recentOrder : a.projectOrder) ? (a.isRecent ? a.recentOrder : a.projectOrder) : Infinity;
        const orderB = Number.isFinite(b.isRecent ? b.recentOrder : b.projectOrder) ? (b.isRecent ? b.recentOrder : b.projectOrder) : Infinity;
        return orderA - orderB;
      });
      // Build the recents array, keeping the media order inside each project
      recents = recentsProjects.flatMap(p => {
        return p.media.filter(m => m.showInRecents).map(m => ({...m, parentProject: p}));
      });
      
      // Projects for the main list (non‑recent projects)
      projectsOnly = allProjects.filter(p => !p.isRecent);
      // Sort main list by projectOrder
      projectsOnly.sort((a, b) => {
        const orderA = Number.isFinite(a.projectOrder) ? a.projectOrder : Infinity;
        const orderB = Number.isFinite(b.projectOrder) ? b.projectOrder : Infinity;
        return orderA - orderB;
      });
      filtered = [...projectsOnly];
      
      renderFilters(); renderProjects(); renderRecents();
    } catch(e) {
      console.error('❌ Failed to load projects:', e);
      document.getElementById('projects-wrap').innerHTML = `<div class="state-box"><h3>Could not load</h3><p>Check that projects.json exists at:<br><code>${JSON_URL}</code></p></div>`;
      document.getElementById('slides-wrap').innerHTML = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.1);font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;">No data</div>`;
    }
  };
  
  function initTheme() { document.body.className = localStorage.getItem('theme') || 'light'; }
  function toggleTheme() {
    const dark = document.body.classList.contains('dark');
    document.body.className = dark ? 'light' : 'dark';
    localStorage.setItem('theme', dark ? 'light' : 'dark');
  }
  const menuEl=document.getElementById('menu'), backdrop=document.getElementById('menu-backdrop'), hamBtn=document.getElementById('hamburger');
  function openMenu() { menuEl.classList.add('open'); backdrop.classList.add('open'); hamBtn.classList.add('open'); document.body.style.overflow='hidden'; }
  function closeMenu() { menuEl.classList.remove('open'); backdrop.classList.remove('open'); hamBtn.classList.remove('open'); document.body.style.overflow=''; }
  function toggleMenu() { menuEl.classList.contains('open') ? closeMenu() : openMenu(); }
  document.addEventListener('keydown', e => { if(e.key==='Escape'){ closeMenu(); closeModal(); closeLightbox({target:document.getElementById('lightbox')}); } });
  let mTX=0;
  menuEl.addEventListener('touchstart',e=>{mTX=e.touches[0].clientX;},{passive:true});
  menuEl.addEventListener('touchend',e=>{if(e.changedTouches[0].clientX-mTX>60)closeMenu();},{passive:true});
  
  function renderFilters() {
    const tags = ['All', ...new Set(projectsOnly.flatMap(p => p.tags||[]))];
    document.getElementById('filters').innerHTML = tags.map(t =>
      `<button class="filter-btn ${t===activeFilter?'active':''}" onclick="setFilter('${esc(t)}')">${esc(t)}</button>`
    ).join('');
  }
  
  function setFilter(tag) { activeFilter = tag; applyFilters(); }
  
  function applyFilters() {
    const searchInput = document.getElementById('search-input');
    searchTerm = searchInput ? searchInput.value.trim().toLowerCase() : '';
    filtered = activeFilter === 'All' ? [...projectsOnly] : projectsOnly.filter(p => p.tags?.includes(activeFilter));
    if (searchTerm) {
      filtered = filtered.filter(p => (p.tags || []).some(tag => tag.toLowerCase().includes(searchTerm)));
    }
    renderFilters();
    renderProjects();
  }
  
  function renderProjects() {
    const wrap = document.getElementById('projects-wrap');
    if (!filtered.length) {
      wrap.innerHTML=`<div class="state-box"><h3>Nothing here</h3><p>No projects match this filter.</p></div>`;
      return;
    }
    wrap.innerHTML = filtered.map((p,i) => {
      const cover = getCover(p);
      const isVidCover = cover && isVideoUrl(cover);
      let coverHTML = '';
      if (cover) {
        if (isVidCover) {
          coverHTML = `<video class="card-cover-video" src="${esc(cover)}" muted loop autoplay playsinline disablepictureinpicture onerror="this.parentElement.innerHTML='<div class=\\'card-cover-none\\'>Video failed</div>'"></video>`;
        } else {
          coverHTML = `<img class="card-cover" src="${clOpt(cover)}" alt="${esc(p.title)}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'card-cover-none\\'>Image failed</div>'">`;
        }
      } else {
        coverHTML = `<div class="card-cover-none">No Image</div>`;
      }
      return `
        <div class="project-card" onclick="openModal('${esc(p.id)}')" style="animation-delay:${i*0.065}s">
          ${coverHTML}
          <div class="card-body">
            <div class="card-body-left">
              <div class="card-meta">
                ${p.year?`<span class="card-year">${esc(p.year)}</span>`:''}
                ${p.tags?.[0]?`<span class="card-tag">${esc(p.tags[0])}</span>`:''}
                ${p.isFeatured?`<span class="card-featured">Featured</span>`:''}
              </div>
              <div class="card-title">${esc(p.title||'Untitled')}</div>
              ${p.subtitle?`<div class="card-subtitle">${esc(p.subtitle)}</div>`:''}
              <div class="card-tags">${(p.tags||[]).slice(1).map(t=>`<span class="tag-pill">${esc(t)}</span>`).join('')}</div>
            </div>
            <div class="card-arrow"><i class="fas fa-arrow-up-right"></i></div>
          </div>
        </div>`;
    }).join('');
  }
  function getCover(p) { if(!p.media?.length) return null; return p.media[p.coverIndex??0]?.url||p.media[0]?.url||null; }
  function isVideoUrl(url) { return /\.(mp4|webm|mov|ogg)(\?|$)/i.test(url)||url.includes('/video/upload/'); }
  
  window.toggleMute = function(e, btn) {
    e.stopPropagation();
    const slide = btn.closest('.slide');
    const video = slide.querySelector('video');
    if(video) {
      video.muted = !video.muted;
      btn.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
    }
  };

  function renderRecents() {
    const wrap=document.getElementById('slides-wrap'), dotsWrap=document.getElementById('slide-dots'), countEl=document.getElementById('recents-count');
    if(!recents.length){ wrap.innerHTML=`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.1);font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;">No recents yet</div>`; return; }
    countEl.textContent=recents.length+' items';
    wrap.innerHTML=recents.map((item,i)=>{
      const p = item.parentProject;
      const cover = item.url;
      const isVid = item.type === 'video' || isVideoUrl(cover);
      let mediaHTML = '';
      if (cover) {
        if (isVid) {
          mediaHTML = `<video class="slide-media" src="${esc(cover)}" muted loop autoplay playsinline disablepictureinpicture onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"></video>
            <div class="slide-placeholder" style="display:none;">Video failed</div>
            <button class="unmute-btn" onclick="toggleMute(event, this)" aria-label="Toggle Audio"><i class="fas fa-volume-mute"></i></button>`;
        } else {
          mediaHTML = `<img class="slide-media" src="${clOpt(cover)}" alt="${esc(p.title)}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div class="slide-placeholder" style="display:none;">Image failed</div>`;
        }
      } else {
        mediaHTML = `<div class="slide-placeholder">No Image</div>`;
      }
      return `<div class="slide ${i===0?'active':''}" data-id="${esc(p.id)}">
        ${mediaHTML}
        <div class="slide-overlay"></div>
        <div class="slide-info">
          ${p.tags?.[0]?`<div class="slide-tag">${esc(p.tags[0])}</div>`:''}
          <div class="slide-title">${esc(p.title||'Untitled')}</div>
          ${p.subtitle?`<div class="slide-sub">${esc(p.subtitle)}</div>`:''}
        </div>
      </div>`;
    }).join('');
    wrap.addEventListener('click', (e) => {
      if(e.target.closest('.unmute-btn')) return;
      const activeSlide = wrap.querySelector('.slide.active');
      if(activeSlide) openModal(activeSlide.dataset.id);
    });
    dotsWrap.innerHTML=recents.map((_,i)=>`<div class="dot ${i===0?'active':''}" onclick="goSlide(${i})"></div>`).join('');
    const sb=document.getElementById('sidebar');
    sb.addEventListener('mouseenter',()=>cancelAnimationFrame(rafId));
    sb.addEventListener('mouseleave',()=>{ progressStart=performance.now()-(parseFloat(document.getElementById('progress-bar')?.style.width||0)/100*SLIDE_MS); animateProgress(); });
    let slTX=0;
    wrap.addEventListener('touchstart',e=>{slTX=e.touches[0].clientX;},{passive:true});
    wrap.addEventListener('touchend',e=>{const d=slTX-e.changedTouches[0].clientX;if(Math.abs(d)>40){d>0?nextSlide():prevSlide();}},{passive:true});
    resetProgress();
  }
  
  function goSlide(i){
    const slides = document.querySelectorAll('.slide');
    const dots = document.querySelectorAll('.dot');
    if(slides[currentSlide]) {
      slides[currentSlide].classList.remove('active');
      const prevVid = slides[currentSlide].querySelector('video');
      if(prevVid) { 
         prevVid.muted = true; 
         const btn = slides[currentSlide].querySelector('.unmute-btn');
         if(btn) btn.innerHTML = '<i class="fas fa-volume-mute"></i>';
      }
    }
    if(dots[currentSlide]) dots[currentSlide].classList.remove('active');
    currentSlide=((i%recents.length)+recents.length)%recents.length;
    if(slides[currentSlide]) slides[currentSlide].classList.add('active');
    if(dots[currentSlide]) dots[currentSlide].classList.add('active');
    resetProgress();
  }
  function prevSlide(){ goSlide(currentSlide-1); }
  function nextSlide(){ goSlide(currentSlide+1); }
  function resetProgress(){ cancelAnimationFrame(rafId); if(recents.length<=1)return; progressStart=performance.now(); animateProgress(); }
  function animateProgress(){
    const pct=Math.min(((performance.now()-progressStart)/SLIDE_MS)*100,100);
    const bar=document.getElementById('progress-bar'); if(bar)bar.style.width=pct+'%';
    if(pct>=100){goSlide(currentSlide+1);return;}
    rafId=requestAnimationFrame(animateProgress);
  }
  
  /* ===== UPDATED openModal FUNCTION ===== */
  function openModal(id){
    const p = allProjects.find(x => x.id === id);
    if (!p) return;
    document.getElementById('modal-title').textContent = p.title || 'Project';
    const media = (p.media || []).filter(m => m.url);
    const hasPreview = !!p.previewUrl, hasLink = !!p.link;
    
    document.getElementById('modal-body').innerHTML = `
      <div class="modal-accent"></div>
      <div class="modal-hero">${esc(p.title || 'Untitled')}</div>
      ${p.subtitle ? `<div class="modal-role">${esc(p.subtitle)}</div>` : ''}
      <div class="modal-meta-inline">
        ${p.year ? `<span class="modal-year">${esc(p.year)}</span>` : ''}
        ${(p.tags || []).map(t => `<span class="modal-tag">${esc(t)}</span>`).join('')}
      </div>
      <div class="modal-description-wrapper">
        ${(() => {
          const rawHtml = p.description || '';
          const stripped = rawHtml.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');
          const isLong = stripped.length > 380;
          window.__modalFullDesc = stripped;
          return `<div class="modal-description ${isLong ? '' : 'expanded'}" id="modal-desc">
            ${isLong ? stripped.substring(0, 380) + '...' : stripped}
          </div>
          ${isLong ? `<button class="read-more-btn" onclick="toggleReadMore(this)">Continue reading <i class="fas fa-chevron-down"></i></button>` : ''}`;
        })()}
      </div>
      <div class="modal-actions">
        ${hasPreview ? `<button class="modal-btn" onclick="togglePreview()"><i class="fas fa-desktop"></i> Preview Site</button>` : ''}
        ${hasLink ? `<a class="modal-btn" href="${esc(p.link)}" target="_blank" rel="noopener"><i class="fas fa-arrow-up-right-from-square"></i> View Live</a>` : ''}
      </div>
      ${hasPreview ? `
        <div class="preview-section" id="preview-section" style="display:none;">
          <p class="section-label">Website Preview</p>
          <div class="preview-frame-wrap">
            <iframe class="preview-iframe" id="preview-iframe" src="" loading="lazy"
              sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
          </div>
        </div>
        <script>window._previewUrl="${esc(p.previewUrl)}";<\/script>` : ''}
      ${media.length ? `
        <p class="section-label">Gallery</p>
        <div class="modal-gallery">
          ${media.map(m => {
            const isVid = m.type === 'video' || isVideoUrl(m.url);
            return `<div class="gallery-item" onclick="openLightbox('${esc(m.url)}','${isVid ? 'video' : 'image'}')">
              ${isVid
                ? `<video src="${esc(m.url)}" muted loop playsinline autoplay onerror="this.parentElement.innerHTML='<div class=\\'broken-media\\'><i class=\\'fas fa-exclamation-triangle\\'></i></div>'"></video>`
                : `<img src="${clOpt(m.url)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'broken-media\\'><i class=\\'fas fa-exclamation-triangle\\'></i></div>'"/>`
              }
            </div>`;
          }).join('')}
        </div>` : ''}
    `;
    
    document.getElementById('modal').classList.add('open');
    document.getElementById('modal').scrollTop = 0;
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(initOrderedMasonry);
  }
  
  window.toggleReadMore = function(btn) {
    const desc = document.getElementById('modal-desc');
    if (!desc || !window.__modalFullDesc) return;
    const expanded = desc.classList.contains('expanded');
    if (expanded) {
      desc.innerHTML = window.__modalFullDesc.substring(0, 380) + '...';
      desc.classList.remove('expanded');
      btn.innerHTML = 'Continue reading <i class="fas fa-chevron-down"></i>';
      btn.classList.remove('expanded');
    } else {
      desc.innerHTML = window.__modalFullDesc;
      desc.classList.add('expanded');
      btn.innerHTML = 'Read less <i class="fas fa-chevron-up"></i>';
      btn.classList.add('expanded');
    }
  };
  
  function togglePreview(){
    const s=document.getElementById('preview-section'), f=document.getElementById('preview-iframe'); if(!s)return;
    if(s.style.display==='none'){s.style.display='block';f.src=window._previewUrl||'';s.scrollIntoView({behavior:'smooth',block:'start'});}
    else{s.style.display='none';f.src='';}
  }
  function closeModal(){ document.getElementById('modal').classList.remove('open'); document.body.style.overflow=''; const f=document.getElementById('preview-iframe');if(f)f.src=''; }
  function openLightbox(url,type){ const inner=document.getElementById('lightbox-inner'); inner.innerHTML=type==='video'?`<video class="lightbox-media" src="${url}" controls autoplay loop muted playsinline></video>`:`<img class="lightbox-media" src="${clOpt(url)}" alt=""/>`; document.getElementById('lightbox').classList.add('open'); document.body.style.overflow='hidden'; }
  function closeLightbox(e){ if(e&&e.target!==document.getElementById('lightbox')&&!e.target.classList.contains('lightbox-close')&&!e.target.closest?.('.lightbox-close'))return; document.getElementById('lightbox').classList.remove('open'); document.getElementById('lightbox-inner').innerHTML=''; document.body.style.overflow=''; }
  function initOrderedMasonry(){
    const gallery=document.querySelector('.modal-gallery'); if(!gallery)return;
    const resizeItems=()=>{
      const styles=getComputedStyle(gallery);
      const row=parseFloat(styles.gridAutoRows)||8;
      const gap=parseFloat(styles.rowGap)||0;
      gallery.querySelectorAll('.gallery-item').forEach(item=>{
        const media=item.querySelector('img, video');
        const itemStyles=getComputedStyle(item);
        const borderY=parseFloat(itemStyles.borderTopWidth)+parseFloat(itemStyles.borderBottomWidth);
        const itemWidth=item.getBoundingClientRect().width;
        let ratio=0;
        if(media?.tagName==='IMG'&&media.naturalWidth){
          ratio=media.naturalHeight/media.naturalWidth;
        } else if(media?.tagName==='VIDEO'&&media.videoWidth){
          ratio=media.videoHeight/media.videoWidth;
        }
        const mediaHeight=ratio&&itemWidth ? itemWidth*ratio : itemWidth*.75;
        const span=Math.ceil((mediaHeight+borderY+gap)/(row+gap));
        item.style.gridRowEnd=`span ${Math.max(span,1)}`;
      });
    };
    requestAnimationFrame(resizeItems);
    gallery.querySelectorAll('img').forEach(img=>{
      if(img.complete&&img.naturalWidth){ requestAnimationFrame(resizeItems); return; }
      img.addEventListener('load',resizeItems,{once:true});
    });
    gallery.querySelectorAll('video').forEach(video=>{
      video.addEventListener('loadedmetadata',resizeItems,{once:true});
      video.addEventListener('loadeddata',resizeItems,{once:true});
    });
  }
  window.addEventListener('resize',()=>requestAnimationFrame(initOrderedMasonry));
  function clOpt(url){ if(!url)return url; if(url.includes('res.cloudinary.com')&&url.includes('/upload/')&&!url.includes('q_auto'))return url.replace('/upload/','/upload/q_auto,f_auto,w_auto/'); return url; }
  function esc(s){ return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  const i18n={
    en:{'eyebrow':'Selected Work','page-title':'Projects & Works','recents':'Recents','end-marker':'- End of selected works -','nav-home':'Home','nav-about':'About','nav-projects':'Projects','nav-booking':'Book Me','back':'Home','filter-all':'All','search-placeholder':'Search projects...'},
    fr:{'eyebrow':'Travaux selectionnes','page-title':'Projets & Travaux','recents':'Recents','end-marker':'- Fin des travaux -','nav-home':'Accueil','nav-about':'A Propos','nav-projects':'Projets','nav-booking':'Me Reserver','back':'Accueil','filter-all':'Tous','search-placeholder':'Rechercher...'},
    es:{'eyebrow':'Trabajo seleccionado','page-title':'Projets y Trabajos','recents':'Recientes','end-marker':'- Fin de trabajos -','nav-home':'Inicio','nav-about':'Acerca','nav-projects':'Proyectos','nav-booking':'Reservarme','back':'Inicio','filter-all':'Todos','search-placeholder':'Buscar proyectos...'},
    de:{'eyebrow':'Ausgewaehlte Arbeiten','page-title':'Projekte & Arbeiten','recents':'Aktuell','end-marker':'- Ende der Arbeiten -','nav-home':'Startseite','nav-about':'Ueber mich','nav-projects':'Projekte','nav-booking':'Buchen','back':'Startseite','filter-all':'Alle','search-placeholder':'Projekte suchen...'},
  };
  let currentLang=localStorage.getItem('lang')||'en';
  document.getElementById('lang-select').value=currentLang;
  function switchLang(lang){currentLang=lang;localStorage.setItem('lang',lang);applyLang(lang);}
  function applyLang(lang){const t=i18n[lang]||i18n.en;document.querySelectorAll('[data-i18n]').forEach(el=>{const key=el.getAttribute('data-i18n');if(t[key]!==undefined)el.innerHTML=t[key];});document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{const key=el.getAttribute('data-i18n-placeholder');if(t[key]!==undefined)el.placeholder=t[key];});document.documentElement.lang=lang;}
  applyLang(currentLang);
</script>
</body>
