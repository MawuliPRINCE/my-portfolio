<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — Ismael Asumanu Prince</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><text y='.9em' font-size='80' font-family='serif' fill='%23ff4500'>P</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#faf9f7; --text:#111; --muted:#888; --accent:#ff4500;
        }
        body.dark {
            --bg:#0d0d0d; --text:#f0ede8; --muted:#555;
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 2rem;
            transition: background .3s, color .3s;
            flex-direction: column;
        }
        .container {
            max-width: 600px; text-align: center;
        }
        h1 { font-size: clamp(3rem, 8vw, 6rem); color: var(--accent); margin-bottom: 0.5rem; }
        p { color: var(--muted); margin-bottom: 2rem; }
        a { color: var(--accent); text-decoration: none; font-weight: 500; }
        .suggestions {
            margin-top: 2rem;
            display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center;
        }
        .suggest-card {
            background: var(--bg); border: 1px solid var(--accent);
            padding: 1rem; border-radius: 8px; width: 150px;
            color: var(--text); text-decoration: none;
            transition: background .2s;
        }
        .suggest-card:hover { background: var(--accent); color: #fff; }
        .suggest-card img { width: 100%; height: 80px; object-fit: cover; border-radius: 4px; }
        .suggest-card .title { font-weight: 600; margin-top: 0.5rem; font-size: .85rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>The page you’re looking for doesn’t exist.<br>Maybe you were looking for one of these projects?</p>
        <div class="suggestions" id="suggestions">
            <div class="suggest-card" style="opacity:.5;">
                <div style="height:80px;background:var(--muted);border-radius:4px;"></div>
                <div class="title">Loading…</div>
            </div>
        </div>
        <p style="margin-top:2rem;"><a href="index.html">← Back to Home</a></p>
    </div>
    <script>
        // Dark mode detection (simplified)
        (function() {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || saved === 'light') {
                if (saved === 'dark') document.body.classList.add('dark');
            } else {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (prefersDark) document.body.classList.add('dark');
            }
        })();

        // Fetch projects and show 3 random ones
        const REPO_URL = 'https://raw.githubusercontent.com/MawuliPRINCE/my-portfolio/main/projects.json';
        fetch(REPO_URL + '?t=' + Date.now())
          .then(r => r.ok ? r.json() : null)
          .then(projects => {
              if (!projects || !projects.length) return;
              const shuffled = [...projects].sort(() => 0.5 - Math.random());
              const suggested = shuffled.slice(0, 3);
              const container = document.getElementById('suggestions');
              container.innerHTML = suggested.map(p => {
                  const cover = p.media?.[p.coverIndex ?? 0]?.url || p.media?.[0]?.url || '';
                  const imgTag = cover ? `<img src="${cover.includes('/upload/') ? cover.replace('/upload/','/upload/w_300,c_fill/') : cover}" alt="">` : `<div style="height:80px;background:var(--muted);border-radius:4px;"></div>`;
                  return `<a class="suggest-card" href="projects.html?open=${p.id}">
                      ${imgTag}
                      <div class="title">${p.title || 'Untitled'}</div>
                  </a>`;
              }).join('');
          })
          .catch(() => {});
    </script>
</body>
</html>
