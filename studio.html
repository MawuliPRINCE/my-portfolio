<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Prince CMS — Studio</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><text y='.9em' font-size='80' font-family='serif' fill='%23ff4500'>P</text></svg>">

<!-- ============================================================ -->
<!-- CONTENT SECURITY POLICY for the CMS                         -->
<!-- Allows inline scripts/styles (needed for rich text editor,  -->
<!-- uploads, etc.) – connections to GitHub & Cloudinary only.   -->
<!-- ============================================================ -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self' 'unsafe-inline' 'unsafe-eval';
  script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://cdn.jsdelivr.net https://www.clarity.ms;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
  font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
  img-src 'self' data: https://*.cloudinary.com https://raw.githubusercontent.com;
  media-src 'self' https://*.cloudinary.com;
  connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://*.cloudinary.com;
  frame-src 'self' https://analytics.google.com;
">

<style>
:root{
  --bg:#0d0d0d;--surface:#161616;--surface2:#1e1e1e;--text:#f0ede8;--muted:#666;
  --border:#2a2a2a;--accent:#ff4500;--accent2:#ff8c00;--success:#44cc88;--warn:#f5a623;--err:#ff4444;
  --F:'DM Sans',sans-serif;--M:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--F);}
body{background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;}
input,textarea,select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:.5rem .75rem;font-size:.82rem;width:100%;border-radius:4px;outline:none;font-family:var(--F);transition:border-color .15s;}
input:focus,textarea:focus,select:focus{border-color:var(--accent);}
textarea{resize:vertical;min-height:90px;}
label{font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.3rem;}
.btn{display:inline-flex;align-items:center;gap:.4rem;justify-content:center;font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:.6rem 1.2rem;border:none;cursor:pointer;transition:all .15s;font-family:var(--F);border-radius:4px;}
.btn-p{background:var(--accent);color:#fff;} .btn-p:hover{background:#e03a00;}
.btn-s{background:var(--surface2);color:var(--text);border:1px solid var(--border);} .btn-s:hover{border-color:var(--accent);color:var(--accent);}
.btn-g{background:var(--surface2);color:var(--success);border:1px solid var(--success);} .btn-g:hover{background:var(--success);color:#000;}
.btn-d{background:transparent;color:var(--err);border:1px solid var(--err);} .btn-d:hover{background:var(--err);color:#fff;}
.btn-sm{padding:.35rem .7rem;font-size:.6rem;}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);}
.login-box{width:440px;max-width:95vw;background:var(--surface);border:1px solid var(--border);padding:2.5rem;border-radius:6px;}
.login-logo{font-size:1.5rem;font-weight:700;color:var(--accent);margin-bottom:.25rem;}
.login-sub{font-size:.7rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2rem;}
.login-section{font-size:.58rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:1.25rem 0 .6rem;padding-top:.75rem;border-top:1px solid var(--border);}
.login-section:first-of-type{margin-top:0;border-top:none;}
#login-error{display:none;background:rgba(255,68,68,.1);border:1px solid var(--err);color:var(--err);padding:.6rem .8rem;font-size:.75rem;border-radius:4px;margin-top:.75rem;}

/* APP SHELL */
#app{display:none;flex:1;flex-direction:column;overflow:hidden;}
.topnav{display:flex;align-items:center;gap:1rem;padding:.6rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.topnav-logo{font-size:.95rem;font-weight:700;color:var(--accent);margin-right:.5rem;}
.topnav-repo{font-size:.62rem;color:var(--muted);letter-spacing:.08em;background:var(--surface2);padding:.25rem .6rem;border-radius:3px;}
.topnav-right{margin-left:auto;display:flex;align-items:center;gap:.5rem;}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface);padding:0 1.5rem;gap:.25rem;flex-shrink:0;overflow-x:auto;}
.tab{font-size:.62rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:.8rem 1rem;background:none;border:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:.4rem;}
.tab:hover{color:var(--text);}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);}
.tab-badge{background:var(--accent);color:#fff;font-size:.5rem;padding:1px 5px;border-radius:10px;font-weight:700;}

/* PANELS */
.panels{flex:1;overflow:hidden;display:flex;}
.panel{display:none;flex:1;overflow:hidden;}
.panel.on{display:flex;}

/* ── PROJECTS PANEL ── */
.proj-shell{display:flex;width:100%;overflow:hidden;}
.sidebar{width:230px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sb-head{padding:.75rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.sb-head-label{font-size:.6rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);}
.sb-list{flex:1;overflow-y:auto;padding:.5rem 0;}
.pi{padding:.55rem 1rem;cursor:pointer;display:flex;align-items:center;gap:.4rem;border-left:2px solid transparent;transition:all .1s;}
.pi:hover{background:var(--surface2);}
.pi.on{background:var(--surface2);border-left-color:var(--accent);}
.pi-name{flex:1;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pi-tag{font-size:.55rem;background:var(--surface);color:var(--muted);padding:1px 5px;border-radius:2px;}
.rb{color:var(--accent);font-size:.7rem;}
.editor-area{flex:1;overflow-y:auto;padding:1.5rem;}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:1rem;color:var(--muted);text-align:center;}
.empty-state h2{font-size:1.2rem;color:var(--text);}
.empty-state p{font-size:.78rem;}
.ed-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.25rem;gap:1rem;}
.ed-title{font-size:1.2rem;font-weight:700;color:var(--text);}
.ed-sub{font-size:.58rem;color:var(--muted);font-family:var(--M);margin-top:.15rem;}
.ed-grid{display:grid;grid-template-columns:1fr 280px;gap:1.25rem;}
.card{background:var(--surface);border:1px solid var(--border);padding:1.25rem;border-radius:4px;margin-bottom:1.25rem;}
.card-title{font-size:.62rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem;}
.fg{margin-bottom:.85rem;}
.fg:last-child{margin-bottom:0;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
.hint{font-size:.65rem;color:var(--muted);font-family:var(--M);margin-bottom:.75rem;line-height:1.5;}
.tog-row{display:flex;align-items:center;justify-content:space-between;padding:.65rem 0;border-bottom:1px solid var(--border);}
.tog-row:last-child{border-bottom:none;}
.tog-lbl{font-size:.75rem;font-weight:500;}
.tog-desc{font-size:.62rem;color:var(--muted);margin-top:.1rem;}
.tog{position:relative;display:inline-block;width:42px;height:22px;}
.tog input{opacity:0;width:0;height:0;}
.tog-sl{position:absolute;inset:0;background:var(--border);border-radius:22px;cursor:pointer;transition:.3s;}
.tog-sl::before{content:'';position:absolute;width:16px;height:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;}
.tog input:checked+.tog-sl{background:var(--accent);}
.tog input:checked+.tog-sl::before{transform:translateX(20px);}
.tags-wrap{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem;}
.tag-chip{font-size:.6rem;background:var(--surface2);border:1px solid var(--border);padding:2px 7px;border-radius:3px;cursor:pointer;display:flex;align-items:center;gap:.2rem;}
.tag-chip:hover{border-color:var(--err);color:var(--err);}
.upload-area{border:1px dashed var(--border);padding:1rem;text-align:center;border-radius:4px;margin-bottom:.5rem;position:relative;cursor:pointer;transition:border-color .2s;}
.upload-area:hover{border-color:var(--accent);}
.upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.upload-area p{font-size:.68rem;color:var(--muted);}
.upload-progress{display:none;margin-bottom:.5rem;}
.prog-bar{background:var(--surface2);height:4px;border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:var(--accent);transition:width .3s;width:0;}
.prog-lbl{font-size:.6rem;color:var(--muted);margin-top:.25rem;font-family:var(--M);}

/* ── DRAG & DROP ── */
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.75rem;}
.m-thumb{aspect-ratio:16/9;border:2px solid var(--border);border-radius:3px;overflow:hidden;cursor:pointer;position:relative;background:var(--surface2);transition:border-color .2s, opacity .2s;}
.m-thumb img,.m-thumb video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
.m-thumb:hover{border-color:var(--accent);}
.m-thumb.cover-selected{border-color:var(--accent);}
.m-thumb.dragging{opacity:0.5; border-style:dashed;}
.m-thumb.drag-over{border-color:var(--accent); background:rgba(255,69,0,0.1);}
.drag-handle{position:absolute; top:4px; left:4px; color:var(--muted); background:rgba(0,0,0,0.6); width:20px; height:20px; border-radius:3px; display:flex; align-items:center; justify-content:center; font-size:0.65rem; cursor:grab; z-index:3; user-select:none;}
.m-thumb-del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.7);color:#fff;border:none;width:18px;height:18px;border-radius:50%;font-size:.65rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:3;}
.m-thumb-del:hover{background:var(--err);}
.m-thumb-recent{position:absolute; top:3px; left:28px; background:rgba(0,0,0,.7); color:var(--muted); border:1px solid transparent; width:20px; height:20px; border-radius:3px; font-size:.75rem; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .2s; z-index:3;}
.m-thumb-recent:hover{background:rgba(0,0,0,.9);color:#fff;}
.m-thumb-recent.on{color:var(--warn);background:rgba(0,0,0,.8);border-color:var(--warn);}
.cover-badge{position:absolute;bottom:3px;left:3px;background:var(--accent);color:#fff;font-size:.5rem;font-weight:700;padding:1px 5px;border-radius:2px;letter-spacing:.06em;text-transform:uppercase;}

/* ── RICH TEXT EDITOR ── */
.rte-toolbar{display:flex;align-items:center;gap:0.3rem;padding:0.4rem;background:var(--surface2);border:1px solid var(--border);border-bottom:none;border-radius:4px 4px 0 0;flex-wrap:wrap;}
.rte-toolbar button{background:none;border:1px solid transparent;color:var(--text);cursor:pointer;padding:0.2rem 0.5rem;font-size:0.75rem;border-radius:3px;line-height:1;transition:background .15s;}
.rte-toolbar button:hover{background:var(--accent);color:#fff;}
.rte-toolbar select{background:var(--surface2);color:var(--text);border:1px solid var(--border);font-size:0.7rem;padding:0.2rem 0.3rem;border-radius:3px;outline:none;}
.rte-sep{width:1px;height:20px;background:var(--border);margin:0 0.15rem;}
.rte-content{padding:0.5rem 0.75rem;border:1px solid var(--border);border-top:none;border-radius:0 0 4px 4px;min-height:90px;max-height:250px;overflow-y:auto;background:var(--surface2);font-size:0.82rem;line-height:1.6;word-break:break-word;}
.rte-content:focus{outline:none;border-color:var(--accent);}
.rte-color-fg, .rte-color-bg{padding:0;width:24px;height:24px;border:none;background:none;cursor:pointer;}
.rte-color-fg::-webkit-color-swatch, .rte-color-bg::-webkit-color-swatch{border:1px solid var(--border);border-radius:3px;}

.order-actions{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.75rem;}
.collab-list{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.75rem;}
.collab-item{display:grid;grid-template-columns:1fr 1fr auto;gap:.5rem;align-items:center;}
.collab-del{width:32px;height:32px;border:1px solid var(--err);background:transparent;color:var(--err);border-radius:4px;cursor:pointer;}
.collab-del:hover{background:var(--err);color:#fff;}
.preview-test-wrap{margin-top:.75rem;}
.preview-frame-outer{position:relative;padding-top:56.25%;border:1px solid var(--border);border-radius:3px;overflow:hidden;}
.preview-iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
.preview-note{font-size:.62rem;color:var(--muted);margin-top:.4rem;line-height:1.5;}
.json-pre{background:var(--surface2);border:1px solid var(--border);padding:.75rem;font-size:.62rem;font-family:var(--M);color:var(--muted);max-height:200px;overflow:auto;border-radius:3px;white-space:pre-wrap;word-break:break-all;}
.pub-bar{display:flex;align-items:center;gap:.75rem;padding:.6rem 1rem;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;}
.pub-spin{display:none;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── SITE CONTENT PANEL ── */
.site-shell{flex:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:1.25rem;}
.site-tabs{display:flex;gap:.4rem;flex-wrap:wrap;}
.st{font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:.45rem .9rem;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;border-radius:3px;transition:all .15s;}
.st.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.site-section{display:none;}
.site-section.on{display:block;}

/* ── REVIEWS PANEL ── */
.reviews-shell{flex:1;overflow-y:auto;padding:1.5rem;}
.review-item{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1rem;margin-bottom:.75rem;}
.review-item-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;}
.review-num{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.stars-row{display:flex;gap:.2rem;}
.star{font-size:1.1rem;cursor:pointer;color:var(--border);transition:color .15s;}
.star.on{color:var(--warn);}

/* ── BOOKINGS PANEL ── */
.bookings-shell{flex:1;overflow-y:auto;padding:1.5rem;}
.booking-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1rem;margin-bottom:.75rem;cursor:pointer;transition:border-color .15s;}
.booking-card:hover{border-color:var(--accent);}
.booking-card.unread{border-left:3px solid var(--accent);}
.booking-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:.5rem;}
.booking-name{font-size:.88rem;font-weight:600;}
.booking-date{font-size:.6rem;color:var(--muted);font-family:var(--M);}
.booking-type{font-size:.58rem;background:var(--accent);color:#fff;padding:2px 8px;border-radius:2px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.booking-preview{font-size:.75rem;color:var(--muted);line-height:1.5;margin-top:.25rem;}
.booking-detail{display:none;margin-top:.85rem;padding-top:.85rem;border-top:1px solid var(--border);}
.booking-detail.open{display:block;}
.detail-row{display:flex;gap:.5rem;margin-bottom:.4rem;align-items:flex-start;}
.detail-label{font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);width:90px;flex-shrink:0;padding-top:.1rem;}
.detail-val{font-size:.78rem;color:var(--text);flex:1;}
.booking-empty{text-align:center;padding:3rem;color:var(--muted);}
.booking-empty h3{font-size:1rem;margin-bottom:.5rem;}
.booking-empty p{font-size:.75rem;}
.booking-status{font-size:.55rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:2px;}
.bs-new{background:rgba(255,69,0,.15);color:var(--accent);}
.bs-read{background:var(--surface2);color:var(--muted);}
.bs-replied{background:rgba(68,204,136,.15);color:var(--success);}

/* ── ANALYTICS PANEL ── */
.analytics-shell{flex:1;overflow-y:auto;padding:1.5rem;}
.analytics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1.25rem;}
.stat-num{font-size:2rem;font-weight:700;color:var(--accent);line-height:1;}
.stat-label{font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:.35rem;}
.stat-sub{font-size:.65rem;color:var(--muted);margin-top:.2rem;}
.ga-embed{width:100%;border:1px solid var(--border);border-radius:4px;background:var(--surface);padding:1.5rem;margin-bottom:1.25rem;}
.ga-title{font-size:.62rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem;}
.ga-iframe-wrap{position:relative;padding-top:60%;border-radius:3px;overflow:hidden;background:var(--surface2);}
.ga-iframe-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
.ga-setup{background:var(--surface2);border:1px dashed var(--border);border-radius:4px;padding:1.5rem;text-align:center;margin-bottom:1rem;}
.ga-setup p{font-size:.78rem;color:var(--muted);line-height:1.7;margin-bottom:1rem;}
.ga-setup code{background:var(--surface);padding:2px 6px;border-radius:3px;font-family:var(--M);font-size:.72rem;color:var(--accent);}
.analytics-section{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1.25rem;margin-bottom:1.25rem;}

/* OVERLAY / DIALOG */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;align-items:center;justify-content:center;}
.overlay.show{display:flex;}
.dialog{background:var(--surface);border:1px solid var(--border);padding:1.75rem;width:380px;max-width:95vw;border-radius:6px;}
.dialog h3{font-size:1rem;margin-bottom:.5rem;}
.dialog p{font-size:.78rem;color:var(--muted);margin-bottom:1.25rem;line-height:1.6;}
.dialog-acts{display:flex;gap:.5rem;justify-content:flex-end;}

/* STATUS */
#status-bar{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--border);padding:.6rem 1.25rem;border-radius:30px;font-size:.72rem;display:flex;align-items:center;gap:.5rem;opacity:0;transition:all .3s;z-index:600;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4);}
#status-bar.show{opacity:1;transform:translateX(-50%) translateY(0);}
#status-bar.success .sdot{background:var(--success);}
#status-bar.error .sdot{background:var(--err);}
#status-bar.info .sdot{background:var(--accent);}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;}
</style>
</head>
<body>

<!-- ============================================================ -->
<!-- PASSCODE GATE – protects the entire CMS                     -->
<!-- ============================================================ -->
<div id="passcode-gate" style="
  position: fixed; inset: 0; background: var(--bg); z-index: 10000;
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem;
">
  <h2 style="color:var(--accent);">Prince Studio</h2>
  <input id="passcode-input" type="password" placeholder="Enter passcode"
    style="padding:0.75rem 1rem; font-size:1rem; width:250px; border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:4px; outline:none;"
    onkeydown="if(event.key==='Enter')checkPasscode()"/>
  <button onclick="checkPasscode()" style="
    background:var(--accent); color:#fff; border:none; padding:0.6rem 1.5rem; border-radius:4px; cursor:pointer; font-weight:600;
  ">Unlock</button>
  <p id="passcode-error" style="color:var(--err); display:none;">Wrong passcode</p>
</div>

<!-- LOGIN (unchanged) -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Prince Studio</div>
    <div class="login-sub">Portfolio CMS</div>
    <p class="login-section">GitHub</p>
    <div class="fg"><label>Username</label><input id="gh-user" placeholder="MawuliPRINCE"/></div>
    <div class="fg"><label>Repository</label><input id="gh-repo" placeholder="my-portfolio"/></div>
    <div class="fg"><label>Branch</label><input id="gh-branch" value="main"/></div>
    <div class="fg"><label>Personal Access Token</label><input id="gh-token" type="password" placeholder="ghp_…"/></div>
    <p class="login-section">Cloudinary (for media uploads)</p>
    <div class="row2">
      <div class="fg"><label>Cloud Name</label><input id="cl-cloud" placeholder="your-cloud"/></div>
      <div class="fg"><label>Upload Preset</label><input id="cl-preset" placeholder="unsigned-preset"/></div>
    </div>
    <p class="login-section">Analytics (optional)</p>

<script>
/* ================================================================
   PASSCODE LOGIC – YOU MUST SET YOUR OWN PASSPHRASE
   
   Simply change 'your-secret-passcode' to your actual secret phrase.
   The browser will hash it automatically.  Example:
   return await crypto.subtle.digest('SHA-256', new TextEncoder().encode('MyStudio2026!'))
   ================================================================ */
const VALID_HASH = (async () => {
  // 👇 REPLACE THE TEXT BELOW WITH YOUR SECRET PASSPHRASE 👇
  return await crypto.subtle.digest('SHA-256', new TextEncoder().encode('$$$143419$$$'))
    .then(h => Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join(''));
})();

async function checkPasscode() {
  const input = document.getElementById('passcode-input').value;
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input))
    .then(h => Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join(''));
  const valid = await VALID_HASH;
  if (hash === valid) {
    document.getElementById('passcode-gate').style.display = 'none';
  } else {
    document.getElementById('passcode-error').style.display = 'block';
  }
}

/* ================================================================
   SECURE HANDLE LOGIN – token stored ONLY in sessionStorage
   ================================================================ */
function handleLogin(){
  const u=gv('gh-user'),r=gv('gh-repo'),b=gv('gh-branch')||'main',t=gv('gh-token');
  const cl=gv('cl-cloud'),pr=gv('cl-preset'),ga=gv('ga-id');
  if(!u||!r||!t){loginErr('GitHub username, repo and token are required.');return;}
  config={user:u,repo:r,branch:b,token:t,cloud:cl,preset:pr,gaId:ga};
  // token stays in sessionStorage (dies when browser closes)
  sessionStorage.setItem('cms_tok',t);
  // other non‑sensitive config can persist in localStorage
  localStorage.setItem('cms_cfg',JSON.stringify({user:u,repo:r,branch:b,cloud:cl,preset:pr,gaId:ga}));
  localStorage.setItem('cms_cloud',cl);localStorage.setItem('cms_preset',pr);
  initApp();
}
function logout(){
  sessionStorage.removeItem('cms_tok');
  localStorage.removeItem('cms_tok_persist'); // clean any old persisted key
  location.reload();
}

// ── GITHUB ─────────────────────────────────────────────────────
async function ghGet(path){
  const r=await fetch(`https://api.github.com/repos/${config.user}/${config.repo}/contents/${path}?ref=${config.branch}`,
    {headers:{'Authorization':`Bearer ${config.token}`,'Accept':'application/vnd.github.v3+json'}});
  if(r.status===404)return null;
  if(!r.ok)throw new Error(`GitHub ${r.status} — check credentials`);
  return r.json();
}
async function ghPut(path,content,sha,msg){
  const body={message:msg,content:btoa(unescape(encodeURIComponent(content))),branch:config.branch};
  if(sha)body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${config.user}/${config.repo}/contents/${path}`,
    {method:'PUT',headers:{'Authorization':`Bearer ${config.token}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){const e=await r.json();throw new Error(e.message);}
  return r.json();
}
function ghDecode(content){return JSON.parse(decodeURIComponent(escape(atob(content.replace(/\n/g,'')))));}

// ── INIT ────────────────────────────────────────────────────────
async function initApp(){
  try{
    const [pd,hd,ad,bd]=await Promise.all([
      ghGet('projects.json'),ghGet('site-home.json'),ghGet('site-about.json'),
      ghGet('bookings.json')
    ]);
    if(pd){projSHA=pd.sha;projects=ghDecode(pd.content);}else{projects=[];projSHA=null;}
    normalizeProjects();
    if(hd){homeSHA=hd.sha;siteData.home=ghDecode(hd.content);fillHomeForm();}
    if(ad){aboutSHA=ad.sha;siteData.about=ghDecode(ad.content);fillAboutForm();
      if(siteData.about.reviews){reviews=siteData.about.reviews;}else{reviews=getDefaultReviews();}
    }
    if(bd){bookingsSHA=bd.sha;bookings=ghDecode(bd.content);}else{bookings=[];bookingsSHA=null;}
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='flex';
    document.getElementById('repo-display').textContent=`${config.user}/${config.repo}`;
    renderSidebar();renderBookings();renderReviews();updateAnalytics();
    await syncPendingBookings();
    if(config.gaId){setupGA();}
    initRichEditors();
    showStatus('Connected ✓','success');
  }catch(e){loginErr(e.message);}
}

// ── TABS ────────────────────────────────────────────────────────
const tabIds=['projects','site','reviews','bookings','analytics'];
function switchTab(tab){
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on',tabIds[i]===tab));
  document.querySelectorAll('.panel').forEach((p,i)=>p.classList.toggle('on',tabIds[i]===tab));
  if(tab==='bookings')refreshBookings();
  if(tab==='analytics')updateAnalytics();
}
function switchSiteTab(tab){
  document.querySelectorAll('.st').forEach(b=>b.classList.remove('on'));
  event.target.classList.add('on');
  document.querySelectorAll('.site-section').forEach(s=>s.classList.remove('on'));
  const map={'home':'ss-home','about':'ss-about','projects-page':'ss-projects-page'};
  document.getElementById(map[tab])?.classList.add('on');
}
